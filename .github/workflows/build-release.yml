name: Build and Release MailExporter

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty to build without release, or specify e.g. v1.1.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build MailExporter macOS App
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest -q

      - name: Build MailExporter.app
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
            export APP_VERSION="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            export APP_VERSION="${{ github.ref_name }}"
          fi
          ./apps/MailExporter/build.sh

      - name: Package application
        run: |
          cd apps/MailExporter
          zip -r -y MailExporter-macOS-arm64.zip MailExporter.app
          shasum -a 256 MailExporter-macOS-arm64.zip > MailExporter-macOS-arm64.zip.sha256
          echo "SHA256: $(cat MailExporter-macOS-arm64.zip.sha256)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailExporter-macOS-arm64
          path: |
            apps/MailExporter/MailExporter-macOS-arm64.zip
            apps/MailExporter/MailExporter-macOS-arm64.zip.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            apps/MailExporter/MailExporter-macOS-arm64.zip
            apps/MailExporter/MailExporter-macOS-arm64.zip.sha256
          generate_release_notes: true
